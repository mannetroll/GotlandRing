name: Verify release downloads
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify native release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --pattern GotlandRing-Portable.exe --pattern GotlandRing-macOS-arm64.zip --pattern SHA256SUMS --dir release
          cd release
          sha256sum --check --strict SHA256SUMS
          unzip -tq GotlandRing-macOS-arm64.zip
